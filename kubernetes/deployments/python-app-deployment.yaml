apiVersion: apps/v1
kind: Deployment

metadata:
  name: python-app
  labels:
    app: python-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: python-app

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%

  template:
    metadata:
      labels:
        app: python-app

    spec:
      containers:
      - name: python-app
        image: python-app:v2
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 5000

        env:
        - name: APP_MESSAGE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: APP_MESSAGE

        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_USERNAME

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_PASSWORD

        resources: {}
